name: Lessons check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lessons_check
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
