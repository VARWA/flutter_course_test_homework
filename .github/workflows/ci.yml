name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v7

      - name: Установить Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Зависимости
        run: flutter pub get

      - name: Проверка форматирования
        run: dart format --output=none --set-exit-if-changed .

      - name: Статический анализ
        run: flutter analyze

      - name: Тесты с покрытием
        run: flutter test --coverage

      - name: Сохранить отчёт о покрытии
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info
